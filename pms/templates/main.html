<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PMS</title>
    {% load static %}
    <script>
        (function () {
            function getCookie(name) {
                var value = "; " + document.cookie;
                var parts = value.split("; " + name + "=");
                if (parts.length === 2) return parts.pop().split(";").shift();
                return null;
            }
            var savedTheme = getCookie("theme_mode");
            var theme = savedTheme === "dark" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css' rel='stylesheet' integrity='sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC' crossorigin='anonymous'>
    <link href='{% static 'css/style.css' %}' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="navbar-container">
        <nav class="navbar navbar-expand-lg  navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
               <a class="navbar-brand" href="{% url 'home'%}">CHAPP-Inn</a>
               <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
               <span class="navbar-toggler-icon"></span>
               </button>
               <div class="collapse navbar-collapse" id="navbarSupportedContent">
                  <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                     <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="{% url 'home'%}" >Home</a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link active btn btn-primary" href="{% url 'search'%}">Nueva reserva</a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard'%}">Dashboard</a>
                     </li>
                     <li class="nav-item">
                        <a class="nav-link" href="{% url 'rooms'%}">Habitaciones</a>
                     </li>
                  </ul>
                  <form action="{% url 'booking_search'%}" method="GET" class="d-flex align-items-center">
                     <input class="form-control me-2" type="search" required name="filter" placeholder="Nombre o Localizador" aria-label="Search">
                     <button class="btn nav-toolbar-btn" type="submit">Buscar</button>
                     <button id="theme-toggle-btn" class="btn nav-toolbar-btn ms-2 theme-toggle-btn" type="button" aria-label="Cambiar tema">
                        <i id="theme-toggle-icon" class="bi bi-sun-fill"></i>
                     </button>
                  </form>
               </div>
            </div>
         </nav>
    </div>
    <div class="container-xl">
        {% block content%}
        
        {% endblock %}
    </div>
    <script src="{% static 'js/theme_mode.js' %}"></script>
</body>
</html>
