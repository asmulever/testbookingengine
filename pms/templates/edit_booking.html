{% extends "main.html"%}

{% block content %}
<section class="rooms-page">
    <div class="rooms-hero">
        <h1 class="rooms-title">Editar datos de contacto</h1>
        <p class="rooms-subtitle">Actualiza la información del cliente asociada a la reserva.</p>
    </div>

    <div class="card border-0 shadow-sm p-4 contact-edit-card">
        <form action="" method="post">
            {% csrf_token%}
            {% for field in customer_form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                <div class="text-danger small mt-1">{{ error }}</div>
                {% endfor %}
            </div>
            {% endfor %}

            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary" href="{% url 'home' %}">Volver</a>
                <button class="btn btn-primary rooms-filter-btn" type="submit">Guardar datos</button>
            </div>
        </form>
    </div>
</section>
{% endblock content%}
